# ==================================================================
# Main TB build entry
# Build command:
#   pb fe build --tb=sis_sinc::ip_sinc_tb_01 --platform="config_1" --disable-partcomp --options "rtl=+lint=none" --clean --name sinc_config_1_tb sis_cfg
# ==================================================================
---
name: ip_sinc_tb_01
requires:
  - foundationware::fw_extensions
  - sis_dv_common_infra::uvmf_base_pkg
  - sis_dv_common_infra::rst_env_pkg
  - sis_dv_common_infra::clk_env_pkg
  - sis_sinc::sinc_01_gpaes_agent_cfg_pkg
  - sis_sinc::sinc_01_gpaes_seed_pkg
  - sis_sinc::sinc_01_gpaes_sys_pkg
  - sis_sinc::sinc_01_paramaters_pkg
  - sis_sinc::sinc_01_ramwrap
  - sis_dv_common_infra::ramwrap_sys_wrapper_env_pkg
  - sis_sinc::sinc_01_gpaes
  - sis_sinc::sinc_01_gpaes_sys_wrapper_env_pkg
  - sis_sinc::sinc_01_ccpui
  - sis_dv_common_infra::ccpui_sys_wrapper_env_pkg
  - sis_sinc::sinc_01_pal
  - sis_dv_common_infra::pal_sys_wrapper_env_pkg
  - sis_sinc::sinc_01_utils_pkg
  - sis_sinc::sinc_01_feature_pkg
  - sis_sinc::sinc_01_csd_pkg
  - sis_sinc::sinc_01_env_pkg
  - sis_sinc::sinc_01_packet_pkg
  - sis_sinc::sinc_01_sequences_pkg
  - sis_sinc::sinc_01_test_pkg
  - sis_dvip::msftdvip_fpga_rams_rtl
  - sis_sinc::ip_sinc_0100_rtl
logical_groups:
  dpi_compile:
    incdirs:
      - $DVINFRA_PATH/dvinfra/bifrost/src/shared/include
      - $DVINFRA_PATH/dvinfra/bifrost/src/system/null/include
      - $COMPILE_ROOT/../../verif/l1/model/func/src
      - $OPENSSL_HOME/include/
      - $VCS_HOME/include
    files:
      - $COMPILE_ROOT/../../verif/l1/model/func/src/aes.cpp
    defines:
      - '-g -Wall -Wextra -std=c++11 -shared -fPIC'
  dpi_link:
    defines:
      - '-lstdc++ -Wl,-rpath,$OPENSSL_HOME/lib -L $OPENSSL_HOME/lib -lssl -lcrypto'
  tb:
    incdirs:
      - ${COMPILE_ROOT}/tb_01/top
    files:
      - ${COMPILE_ROOT}/tb_01/top/msftDvIp_fpga_ram.sv
      - ${COMPILE_ROOT}/tb_01/top/sinc_if_bind.sv
      - ${COMPILE_ROOT}/tb_01/top/hvl_top.sv
      - ${COMPILE_ROOT}/tb_01/top/hdl_top.sv
    defines:
      - +define+PB_BUILD
      - +define+SIMULATION
      - +define+PLAT__L1
      - +define+SYNOPSYS_SV
      - +define+UVM_PACKER_MAX_BYTES=1500000
      - +define+UVM_DISABLE_AUTO_ITEM_RECORDING
      - +define+UVMC_MAX_WORDS=32
      - +define+SIM=1
      - +define+UVM_REG_DATA_WIDTH=256
      - +define+MAP_PROT_ATTR
      - +define+MVC_NO_DEPRECATED
      - +define+GPAES_IF_OUTPUT_DLY=0
    tops:
      - hdl_top
      - hvl_top
    views:
      config_1:
        defines:
          - +define+SUBSYSTEM=config_1
          - +define+GPAES_MAX_SEED_DATA_WIDTH=32

