logical_groups:
  tb:
    defines:
      - +define+PAL_USE_MENTOR_AXI_VIP=true
      - +define+PAXOS_USE_SPARSE_MEMORY=1
      - +define+PAXOS_AXI_SLAVE=1
      - +define+PAXOS_AXI_4=1
      - +define+PAL_MAX_NUM_MASTERS=1
      - +define+PAL_MAX_NUM_SLAVES=1
      - +define+PAL_MAX_ID_WIDTH=4
      - +define+PAL_MAX_ADDR_USER_WIDTH=22
      - +define+MSFT_AXI_MAX_ADDR_USER_WIDTH=22
      - +define+PAL_MAX_ADDR_WIDTH=32
      - +define+PAL_MAX_DATA_WIDTH=32
      - +define+PAL_MAX_NUM_SLAVE_REGIONS=16
      - +define+MSFT_AXI_MAX_ADDR_WIDTH=32
      - +define+MSFT_AXI_MAX_DATA_WIDTH=32
      - +define+MSFT_AXI_MAX_ID_WIDTH=15
      - +define+SVT_AXI_MAX_DATA_WIDTH=32
      - +define+SVT_AXI_MAX_DATA_USER_WIDTH=32
      - +define+SVT_AXI_DISABLE_DEBUG_PORTS=1
      - +define+MS_AXI_EXTENSION=1
    incdirs:
      - ${COMPILE_ROOT}/tb_01/top
    files:
      - ${COMPILE_ROOT}/tb_01/top/pal_01_user_params_pkg.sv
    tops: [pal_user_params_pkg, pal_pkg]

---
name: sinc_01_ramwrap
requires:
