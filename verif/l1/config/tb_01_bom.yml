---
name: sinc_01_packet_pkg
requires:
  - sis_sinc::sinc_01_reg_pkg
  - sis_sinc::sinc_01_regmodel_pkg
logical_groups:
  tb:
    incdirs:
      - ${COMPILE_ROOT}/tb_01/packets
    files:
      - ${COMPILE_ROOT}/tb_01/packets/sinc_packet_pkg.sv
    tops: [sinc_packet_pkg]

---
# 0101-design variant of sinc_01_paramaters_pkg (paths point to src/sinc/0101).
# Per-platform parameter source picked via views; declares package
# sinc_parameters_pkg in all variants. config_1 sets SINC_NO_SEED_LOADING=1
# and defines SINC_WITH_NO_SEED_LOADING so hdl_top wires the override into
# sinc_top.NO_SEED_LOADING.
name: sinc_01_0101_paramaters_pkg
logical_groups:
  tb:
    incdirs:
      - ${COMPILE_ROOT}/../../0101/include
      - ${COMPILE_ROOT}/../../0101/rtl
      - ${COMPILE_ROOT}/tb_01/interfaces
      - $SIS_BASE_PATH/src/ss_common/config_1
      - $SIS_BASE_PATH/src/trivium/0102/include
      - $SIS_AES_PATH/src/aes/0107/include
      - ${COMPILE_ROOT}/tb_01/top
    files:
      - ${COMPILE_ROOT}/../../0101/rtl/sinc_pkg.sv
      - $SIS_GPAES_PATH/src/gpaes/0101/rtl/gp_aes_pkg.sv
    tops: [sinc_parameters_pkg]
    views:
      config_1:
        defines:
          - +define+SUBSYSTEM=config_1
          - +define+SINC_WITH_NO_SEED_LOADING
        files:
          - ${COMPILE_ROOT}/tb_01/top/sinc_01_0101_config_1_parameters_pkg.sv
          - ${COMPILE_ROOT}/tb_01/top/sinc_01_vtag_ram_wrap.sv

