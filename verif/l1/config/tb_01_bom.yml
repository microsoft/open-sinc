      - +define+CCPUI_SYS_MAX_NUM_CPU_MEMS=1
      - +define+CCPUI_SYS_MAX_NUM_MPUS=1
      - +define+CCPUI_CPU_MEM_MAX_ADDR_WIDTH=22
      - +define+CCPUI_CPU_MEM_MAX_DATA_WIDTH=32
