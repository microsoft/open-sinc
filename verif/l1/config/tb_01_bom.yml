      - ${COMPILE_ROOT}/tb_01/uvc/gp_aes/seed/gpaes_seed_if.sv
      - ${COMPILE_ROOT}/tb_01/uvc/gp_aes/seed/gpaes_seed_pkg.svh
    tops: [gpaes_seed_pkg]

---
name: sinc_01_gpaes_sys_pkg
requires:
  - sis_sinc::sinc_01_gpaes_agent_cfg_pkg
  - sis_sinc::sinc_01_gpaes_seed_pkg
logical_groups:
