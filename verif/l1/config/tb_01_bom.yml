      - +define+RAMWRAP_SYS_MAX_NUM_ERASES=2
      - +define+RAMWRAP_SYS_MAX_NUM_MEMS=2
      - +define+RAMWRAP_SYS_MAX_NUM_INJECTS=2
      - +define+RAMWRAP_ENGINE_MAX_ADDR_WIDTH=32
      - +define+RAMWRAP_ENGINE_MAX_DATA_WIDTH=160
      - +define+RAMWRAP_ERASE_MAX_DATA_WIDTH=160
      - +define+RAMWRAP_MAX_ADDR_WIDTH=32
      - +define+RAMWRAP_MAX_DATA_WIDTH=160
    incdirs:
      - ${COMPILE_ROOT}/tb_01/top
    files:
      - ${COMPILE_ROOT}/tb_01/top/sinc_ramwrap_user_params_pkg.sv
    tops: [sinc_ramwrap_user_params_pkg]

---
name: sinc_01_gpaes
