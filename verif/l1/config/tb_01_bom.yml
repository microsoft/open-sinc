---
name: sinc_01_gpaes_agent_cfg_pkg
logical_groups:
  tb:
    incdirs:
      - ${COMPILE_ROOT}/tb_01/uvc/gp_aes/cfg
    files:
      - ${COMPILE_ROOT}/tb_01/uvc/gp_aes/cfg/gpaes_agent_config_pkg.svh
